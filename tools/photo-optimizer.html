<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리 사진 압축 도구</title>
<style>body{font-family:'Nanum Myeongjo',serif;max-width:560px;margin:40px auto;padding:0 20px;color:#34332F;line-height:1.7}
h1{font-size:20px;color:#5b0d1d}label.drop{display:block;border:1.5px dashed #B99A6A;border-radius:16px;padding:32px;text-align:center;cursor:pointer;background:#f6f2e8}
button{margin-top:16px;height:48px;padding:0 32px;border:0;border-radius:9999px;background:#5b0d1d;color:#e0ddd4;font:inherit;cursor:pointer}button:disabled{opacity:.4}
#log{margin-top:16px;font-size:14px;white-space:pre-line}</style></head><body>
<h1>갤러리 사진 압축 도구</h1>
<p>원본 사진을 한꺼번에 선택하면 폭 700px, JPEG 품질 75%로 줄여서 <b>1.jpg, 2.jpg …</b> 이름의 zip 한 개로 내려받습니다. 파일명 순서대로 번호가 매겨집니다. 압축을 풀어 <b>site/assets/gallery/</b> 폴더에 넣고 다시 배포하세요. (사진은 내 컴퓨터 안에서만 처리되며 어디에도 업로드되지 않습니다)</p>
<label class="drop"><input id="f" type="file" accept="image/*" multiple hidden>여기를 눌러 원본 사진 선택</label>
<button id="go" disabled>압축하고 zip 받기</button><div id="log"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const W=700,Q=.75,f=document.getElementById('f'),go=document.getElementById('go'),log=document.getElementById('log');let files=[];
f.onchange=()=>{files=[...f.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));log.textContent=files.length+'장 선택됨';go.disabled=!files.length};
go.onclick=async()=>{go.disabled=true;const z=new JSZip();let before=0,after=0;
  for(let i=0;i<files.length;i++){const file=files[i];log.textContent='처리 중 '+(i+1)+'/'+files.length;before+=file.size;
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const w=Math.min(W,bmp.width),h=Math.round(bmp.height*w/bmp.width),c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',Q));after+=blob.size;z.file((i+1)+'.jpg',blob)}
  const out=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='gallery.zip';a.click();
  log.textContent='완료: '+(before/1048576).toFixed(1)+'MB → '+(after/1048576).toFixed(1)+'MB ('+Math.round(after/before*100)+'%)';go.disabled=false};
</script></body></html>
